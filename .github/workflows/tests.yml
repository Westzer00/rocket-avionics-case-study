name: Rocket code and flight assets checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest Pillow pytest-cov ruff
      - name: Static lint (undefined names and unused imports)
        run: ruff check --select F examples tests
      - name: Python syntax
        run: python -m compileall -q examples tests
      - name: Descent logic and image tests
        run: python -m pytest -q -s --cov=examples --cov-report=term-missing
      - name: Run independent example
        run: python examples/descent_detector.py > /dev/null
