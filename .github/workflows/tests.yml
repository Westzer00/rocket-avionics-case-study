name: Rocket descent-detector example tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Test independent descent detector
        run: python -m pytest -q
      - name: Run example
        run: python examples/descent_detector.py > /dev/null
